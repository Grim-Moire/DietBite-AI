function startApp() {
    document.getElementById("start").classList.remove("active");

        "Log: \n Demo started successfully";
		setTimeout(function() {
        document.getElementById("output").innerText = "Log:";
    }, 10000);
}


// ---------------- TRAINING ----------------
function trainModel() {
    document.getElementById("output").innerText =
        "Log: \n In the demo version of this project, this function is unavailable. Download the full version to train your own model and see what dishes suit you";
		setTimeout(function() {
        document.getElementById("output").innerText = "Log:";
    }, 10000);
}

// ---------------- DECISION TREE (Real AI Model transformed into a decision tree) ----------------
function predictModel(salt, time, fat, sugar) {

    // ROOT
    if (fat <= 14.5) {

        if (time <= 32.5) {

            if (fat <= 12.0) {

                if (sugar <= 9.0) {

                    // final split
                    if (fat <= 5.5) {
                        return 1; // suitable
                    } else {
                        return 0; // not suitable
                    }

                } else {
                    return 0;
                }

            } else {
                return 0;
            }

        } else {

            if (fat <= 5.5) {
                return 0;
            } else {
                return 1;
            }
        }

    } else {

        if (time <= 105.0) {

            if (fat <= 18.0) {

                if (time <= 30.0) {

                    return 0;

                } else {

                    return 0;
                }

            } else {

                return 0;
            }

        } else {

            return 1;
        }
    }
}
